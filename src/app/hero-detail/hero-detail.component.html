<div *ngIf="hero as h">
  <h2>{{h.name | uppercase}} Details</h2>
  <div><span>id: </span>{{h.id}}</div>
  <div>
    <label for="hero-name">Hero name: </label>
    <input id="hero-name" [(ngModel)]="h.name" placeholder="Hero name" />
  </div>
  <button type="button" (click)="goBack()">go back</button>
  <button type="button" (click)="save()">save</button>
</div>
